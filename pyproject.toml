[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixerdo-latencybudget"
version = "0.1.0"
description = "按阶段分解检索耗时，标出超出分配预算的阶段与累积放大效应"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pixerdo" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pixerdo.github.io"
Repository = "https://github.com/pixerdo/latencybudget"
Issues = "https://github.com/pixerdo/latencybudget/issues"

[project.scripts]
latencybudget = "latencybudget:main"

[tool.setuptools]
py-modules = ["latencybudget"]
